name: Generate Random Code

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate random alphanumeric code
        run: |
          RANDOM_CODE=$(openssl rand -base64 15 | tr -dc 'a-zA-Z0-9' | head -c 16)
          echo "Generated code: $RANDOM_CODE"

          # Write it to a file
          echo "$RANDOM_CODE" > random-code.txt
          echo "$(date -u): $RANDOM_CODE" >> random-code-log.txt

      - name: Commit and Push changes
        run: |
          git config --local user.email "varletint@hotmail.com"
          git config --local user.name "varletint"
          git add random-code.txt random-code-log.txt

          # IMPORTANT: We add [skip ci] to prevent this push from infinitely triggering the workflow again
          git commit -m "chore: update random code [skip ci]" || echo "No changes to commit"

          # Push changes explicitly to main
          git push origin HEAD:main
